<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Gerenciamento de ocorrências</title>
    <link rel="stylesheet" href="../../assets/css/gerenciamento.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"
        integrity="sha384-A97u3Qnt9GZHURO9YJZRe7VQgGUeFzcv6I1oIGnUTxQrCxnpQMwR0/G8F2zt9abZ"
        crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
    <script src="../../assets/js/supabase-config.js" defer></script>
    <script src="../../assets/js/cliente-supabase.js" defer></script>
    <script src="../../assets/js/protecao-admin.js" defer></script>
    <script src="../../assets/js/ocorrencias.js" defer></script>
    <script src="../../assets/js/gerenciar.js" defer></script>
</head>

<body class="aguardando-acesso">
    <header class="cabecalho">
        <div>
            <img src="../../assets/img/fundo.png" alt="" class="logo2">
            <img src="../../assets/img/logo1.png" alt="Logo Inovarc" class="logo1">
        </div>

        <div class="perfil no-print">AD</div>
    </header>

    <main class="container">
        <section class="card foto-problema">
            <h2>Foto do Problema</h2>

            <div class="imagem-ocorrencia">
                <div id="fotos" class="fotos"></div>
                <p id="legendaFoto">Carregando...</p>
                <span id="categoria">Categoria:</span>
            </div>
        </section>

        <section class="card localizacao">
            <h2>Localização Exata</h2>

            <div class="endereco">
                <span>📍 Endereço</span>
                <p id="endereco"></p>
            </div>

            <div class="mapa">
                <div class="marcador">📍</div>
                <a id="linkMapa" href="#" target="_blank" rel="noopener noreferrer" hidden>Abrir no Google Maps →</a>
            </div>
        </section>

        <section class="card detalhes">
            <h2>Detalhes da Solicitação</h2>

            <div class="informacao">
                <span>Descrição do Cidadão</span>
                <p id="descricao" class="texto-livre"></p>
            </div>

            <div class="informacao">
                <span>Data de Recebimento</span>
                <p id="dataRecebimento"></p>
            </div>

            <div class="informacao">
                <span>Reportado por</span>
                <p id="reportadoPor"></p>
            </div>
        </section>

        <section class="card notas">
            <h2>Notas Internas</h2>

            <ul class="lista-notas"></ul>

            <textarea placeholder="Escreva uma nova nota" maxlength="2000"></textarea>

            <button class="salvar-notas" type="button">Salvar nota</button>
        </section>

        <section class="card gerenciamento">
            <h2>Gerenciar Status</h2>

            <label>Status Atual</label>

            <div class="status-atual"></div>

            <label>Atualizar para:</label>

            <div class="opcoes-status">
                <button type="button" data-status="pendente">Pendente</button>
                <button type="button" data-status="em_analise">Em análise</button>
                <button type="button" data-status="em_andamento">Em andamento</button>
                <button type="button" data-status="concluido">Concluído</button>
            </div>
        </section>

        <section class="card acoes no-print">
            <h2>Ações Rápidas</h2>

            <button class="atribuir" type="button">Atribuir Equipe</button>

            <button class="imprimir" type="button">Imprimir Relatório</button>

            <button class="compartilhar" type="button">Compartilhar</button>

            <button class="voltar" type="button">Voltar</button>
        </section>
    </main>
</body>
</html>
