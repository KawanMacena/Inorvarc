<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assets/css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <title>Inovarc - Login</title>

</head>

<body>

    <div class="container">

        <div class="box">

            <img src="../../assets/img/logo-sf.png" alt="Logo da Inovarc" class="logo">

            <h1 class="title">Faça login aqui!</h1>
            <p class="subtitle">Por favor, preencha seus dados.</p>
            <form>
                <label class="paragrafo" for="username">Nome de usuário:</label>
                <input type="text" id="username" name="username" required>
            <br>
                <label class="paragrafo" for="password">Senha:</label>
                <input type="password" id="password" name="password" required>
            <br>
                <button class="button" type="submit" onclick="logar(); return false" >Entrar</button>
        </form>



        </div>
    </div>
    <script src="../../assets/js/logar.js"></script>
</body>
</html>
