<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">

    <link rel="stylesheet" href="../../assets/css/painel.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"
        integrity="sha384-A97u3Qnt9GZHURO9YJZRe7VQgGUeFzcv6I1oIGnUTxQrCxnpQMwR0/G8F2zt9abZ"
        crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
    <script src="../../assets/js/supabase-config.js" defer></script>
    <script src="../../assets/js/cliente-supabase.js" defer></script>
    <script src="../../assets/js/protecao-admin.js" defer></script>
    <script src="../../assets/js/ocorrencias.js" defer></script>
    <script src="../../assets/js/painel.js" defer></script>

    <title>Painel Administrativo</title>
</head>

<body class="aguardando-acesso">

    <header class="header">

        <div class="header-left">
            <img src="../../assets/img/logo.jpeg" alt="Logo">

            <div class="titulo">
                <h1>Painel Administrativo</h1>
                <p>Gestão de Solicitações</p>
            </div>
        </div>

        <div class="header-right">
            <a href="../acesso/index.html" data-sair>Sair</a>

            <div class="notificacao">
                🔔
                <span id="contadorPendentes">0</span>
            </div>

            <div class="perfil">
                <p>AD</p>
            </div>
        </div>

    </header>

    <main class="container">

        <section class="cards">

            <div class="card pendente">
                <h3>Pendentes</h3>
                <h2 data-total="pendente">0</h2>
            </div>

            <div class="card analise">
                <h3>Em Análise</h3>
                <h2 data-total="em_analise">0</h2>
            </div>

            <div class="card andamento">
                <h3>Em Andamento</h3>
                <h2 data-total="em_andamento">0</h2>
            </div>

            <div class="card concluido">
                <h3>Concluídos</h3>
                <h2 data-total="concluido">0</h2>
            </div>

        </section>

        <section class="filtros">

            <input id="busca" type="text" placeholder="Buscar por endereço, categoria ou descrição...">

            <select id="filtroStatus">
                <option value="">Todos os Status</option>
                <option value="pendente">Pendente</option>
                <option value="em_analise">Em análise</option>
                <option value="em_andamento">Em andamento</option>
                <option value="concluido">Concluído</option>
            </select>

        </section>

        <section class="tabela">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Categoria</th>
                        <th>Localização</th>
                        <th>Descrição</th>
                        <th>Status</th>
                        <th>Recebido</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="corpoTabela"></tbody>
            </table>

        </section>

    </main>

</body>
</html>
